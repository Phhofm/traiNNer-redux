# yaml-language-server: $schema=https://raw.githubusercontent.com/the-database/traiNNer-redux/refs/heads/master/schemas/redux-config.schema.json
#########################################################################################
# NERVE 4x — S0 baseline — GAN engine (dunet D + VGG19 perceptual)
#
# Engine-comparison run: 60k iters, matched patch 64 / batch 8 / seed 1024,
# warm-started from the official 4x NERVE fidelity pretrain, Lucid OTF data,
# Lucid CC0 validation set every 5k, checkpoints every 20k.
# EXPERIMENT — part of the GAN-replacement ablation (see FORK_CHANGES.md).
#########################################################################################
amp_bf16: true
blur_prob: 0.6
blur_prob2: 0.3
compile_mode: default
datasets:
  train:
    accum_iter: 1
    batch_size_per_gpu: 8
    betag_range:
    - 0.5
    - 4
    betag_range2:
    - 0.5
    - 4
    betap_range:
    - 1
    - 2
    betap_range2:
    - 1
    - 2
    blur_kernel_size: 12
    blur_kernel_size2: 12
    blur_sigma:
    - 0.2
    - 2
    blur_sigma2:
    - 0.2
    - 1
    dataroot_gt:
    - datasets/train/lucid_hc512/hr
    final_kernel_range:
    - 5
    - 17
    kernel_list:
    - iso
    - aniso
    - generalized_iso
    - generalized_aniso
    - plateau_iso
    - plateau_aniso
    kernel_list2:
    - iso
    - aniso
    - generalized_iso
    - generalized_aniso
    - plateau_iso
    - plateau_aniso
    kernel_prob:
    - 0.45
    - 0.25
    - 0.12
    - 0.03
    - 0.12
    - 0.03
    kernel_prob2:
    - 0.45
    - 0.25
    - 0.12
    - 0.03
    - 0.12
    - 0.03
    kernel_range:
    - 5
    - 17
    kernel_range2:
    - 5
    - 17
    lq_size: 64
    name: Lucid OTF Train
    num_worker_per_gpu: 8
    type: realesrgandataset
    use_hflip: true
    use_rot: true
  val:
    dataroot_gt:
    - datasets/val/hnt_val/hr
    dataroot_lq:
    - datasets/val/hnt_val/lr_x4
    name: Lucid Val x4
    type: pairedimagedataset
fast_matmul: false
gaussian_noise_prob: 0.4
gaussian_noise_prob2: 0.3
gray_noise_prob: 0.1
gray_noise_prob2: 0.05
high_order_degradation: true
jpeg_prob: 0.4
jpeg_prob2: 0.3
jpeg_range:
- 40
- 95
jpeg_range2:
- 40
- 95
logger:
  print_freq: 200
  save_checkpoint_format: safetensors
  save_checkpoint_freq: 20000
  use_tb_logger: true
lq_usm: true
lq_usm_radius_range:
- 1
- 25
name: 4x_otf_gan_engine
network_d:
  type: dunet
network_g:
  type: nerve
noise_range:
- 1
- 15
noise_range2:
- 1
- 10
num_gpu: auto
path:
  param_key_g: null
  pretrain_network_g: /home/phips/.cache/huggingface/hub/models--Phips--NERVE/snapshots/3619eb1a67d775d9357bdb808336700e681b3eaf/models/4x_NERVE_release.safetensors
  resume_state: null
  strict_load_g: true
poisson_scale_range:
- 0.05
- 2
poisson_scale_range2:
- 0.05
- 1.5
queue_size: 120
resize_mode_list:
- bilinear
- bicubic
- nearest-exact
- lanczos
resize_mode_list2:
- bilinear
- bicubic
- nearest-exact
- lanczos
resize_mode_list3:
- bilinear
- bicubic
- nearest-exact
- lanczos
resize_mode_prob:
- 0.25
- 0.25
- 0.25
- 0.25
resize_mode_prob2:
- 0.25
- 0.25
- 0.25
- 0.25
resize_mode_prob3:
- 0.25
- 0.25
- 0.25
- 0.25
resize_prob:
- 0.2
- 0.7
- 0.1
resize_prob2:
- 0.3
- 0.4
- 0.3
resize_range:
- 0.4
- 1.5
resize_range2:
- 0.6
- 1.2
scale: 4
train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: false
  grad_clip_max_norm: 100
  losses:
  - type: mssimloss
    loss_weight: 0.5
  - type: perceptualloss
    criterion: charbonnier
    loss_weight: 0.01
  - type: hsluvloss
    criterion: charbonnier
    loss_weight: 1.0
  - type: ganloss
    gan_type: vanilla
    loss_weight: 0.1
  optim_d:
    betas:
    - 0.9
    - 0.99
    lr: 0.0001
    type: AdamW
    weight_decay: 0
  optim_g:
    betas:
    - 0.9
    - 0.99
    lr: 0.0001
    type: AdamW
    weight_decay: 0
  scheduler:
    gamma: 0.5
    milestones:
    - 75000
    - 120000
    type: MultiStepLR
  total_iter: 60000
  warmup_iter: -1
use_amp: true
use_channels_last: true
use_compile: true
val:
  metrics:
    dists:
      better: lower
      type: calculate_dists
    lpips:
      better: lower
      type: calculate_lpips
    psnr:
      crop_border: 4
      test_y_channel: false
      type: calculate_psnr
    ssim:
      crop_border: 4
      test_y_channel: false
      type: calculate_ssim
    topiq:
      type: calculate_topiq
  save_img: false
  tile_overlap: 16
  tile_size: 256
  val_enabled: true
  val_freq: 5000
manual_seed: 1024
