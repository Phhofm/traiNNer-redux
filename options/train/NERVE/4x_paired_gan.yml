name: 4x_paired_gan_engine
scale: 4
use_amp: true
amp_bf16: true
use_channels_last: true
fast_matmul: false
use_compile: true
num_gpu: auto
manual_seed: 1024
datasets:
  train:
    name: LUCID Paired Train
    type: pairedimagedataset
    dataroot_gt:
    - datasets/train/lucid_hc512/hr
    dataroot_lq:
    - datasets/train/lucid_hc512/lr_x4
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
  val:
    name: Lucid Paired Val
    type: pairedimagedataset
    dataroot_gt:
    - datasets/val/hnt_val/hr
    dataroot_lq:
    - datasets/val/hnt_val/lr_x4
network_g:
  type: nerve
path:
  pretrain_network_g: /home/phips/.cache/huggingface/hub/models--Phips--NERVE/snapshots/3619eb1a67d775d9357bdb808336700e681b3eaf/models/4x_NERVE_release.safetensors
  param_key_g: null
  strict_load_g: true
  resume_state: null
train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: false
  grad_clip_max_norm: 100.0
  optim_g:
    type: AdamW
    lr: 0.0001
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones: []
    gamma: 0.5
  total_iter: 60000
  warmup_iter: -1
  losses:
  - type: mssimloss
    loss_weight: 0.5
  - type: perceptualloss
    criterion: charbonnier
    loss_weight: 0.01
  - type: hsluvloss
    criterion: charbonnier
    loss_weight: 1.0
  - type: ganloss
    gan_type: vanilla
    loss_weight: 0.1
  optim_d:
    type: AdamW
    lr: 0.0001
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 256
  tile_overlap: 16
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
    lpips:
      type: calculate_lpips
      better: lower
    dists:
      type: calculate_dists
      better: lower
    topiq:
      type: calculate_topiq
logger:
  print_freq: 200
  save_checkpoint_freq: 20000
  save_checkpoint_format: safetensors
  use_tb_logger: true
network_d:
  type: dunet
