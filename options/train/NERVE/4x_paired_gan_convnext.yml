# yaml-language-server: $schema=https://raw.githubusercontent.com/the-database/traiNNer-redux/refs/heads/master/schemas/redux-config.schema.json
#########################################################################################
# NERVE 4x — S2 — GAN (dunet D) with ConvNeXt-Nano perceptual
#
# Engine ablation, same matched protocol as 4x_paired_{gan,sharpened_dists,topiq_nr}
# (patch 64, batch 4, seed 1024, 30k iters, Lucid paired, Lucid-val every 10k).
# EXPERIMENT — see FORK_CHANGES.md / ABLATIONS.md.
#########################################################################################
amp_bf16: true
datasets:
  train:
    batch_size_per_gpu: 4
    dataroot_gt:
    - datasets/train/lucid_hc512/hr
    dataroot_lq:
    - datasets/train/lucid_hc512/lr_x4
    lq_size: 64
    name: LUCID Paired Train
    num_worker_per_gpu: 8
    type: pairedimagedataset
    use_hflip: true
    use_rot: true
  val:
    dataroot_gt:
    - datasets/val/hnt_val/hr
    dataroot_lq:
    - datasets/val/hnt_val/lr_x4
    name: Lucid Paired Val
    type: pairedimagedataset
fast_matmul: false
logger:
  print_freq: 200
  save_checkpoint_format: safetensors
  save_checkpoint_freq: 10000
  use_tb_logger: true
manual_seed: 1024
name: 4x_paired_gan_convnext_engine
network_d:
  type: dunet
network_g:
  type: nerve
num_gpu: auto
path:
  param_key_g: null
  pretrain_network_g: /home/phips/.cache/huggingface/hub/models--Phips--NERVE/snapshots/3619eb1a67d775d9357bdb808336700e681b3eaf/models/4x_NERVE_release.safetensors
  resume_state: null
  strict_load_g: true
scale: 4
train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: false
  grad_clip_max_norm: 100.0
  losses:
  - type: mssimloss
    loss_weight: 0.5
  - type: convnextperceptualloss
    criterion: charbonnier
    loss_weight: 0.01
    model_name: convnext_nano
  - type: hsluvloss
    criterion: charbonnier
    loss_weight: 1.0
  - type: ganloss
    gan_type: vanilla
    loss_weight: 0.1
  optim_d:
    type: AdamW
    lr: 0.0001
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  optim_g:
    betas:
    - 0.9
    - 0.99
    lr: 0.0001
    type: AdamW
    weight_decay: 0
  scheduler:
    gamma: 0.5
    milestones: []
    type: MultiStepLR
  total_iter: 30000
  warmup_iter: -1
use_amp: true
use_channels_last: true
use_compile: true
val:
  metrics:
    dists:
      better: lower
      type: calculate_dists
    lpips:
      better: lower
      type: calculate_lpips
    psnr:
      crop_border: 4
      test_y_channel: false
      type: calculate_psnr
    ssim:
      crop_border: 4
      test_y_channel: false
      type: calculate_ssim
    topiq:
      type: calculate_topiq
  metrics_enabled: true
  save_img: false
  tile_overlap: 16
  tile_size: 256
  val_enabled: true
  val_freq: 10000
